<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover and acquire extraordinary alternative dwellings worldwide. Vetted mud houses, timber treehouses, modular container homes, and dome sanctuaries." />
    <title>RareNest — Homes That Tell a Story</title>
  </head>
  <body>
    <div id="root">
      <div class="spinner-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #fefcf8; font-family: sans-serif;">
        <style>
          .initial-spinner {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
          }
          .initial-spinner span {
            background: #c16a3c;
            width: 6px;
            height: 23px;
            animation: grow 1s ease-in-out infinite;
          }
          .initial-spinner span:nth-child(2) {
            animation: grow 1s ease-in-out 0.15s infinite;
          }
          .initial-spinner span:nth-child(3) {
            animation: grow 1s ease-in-out 0.3s infinite;
          }
          .initial-spinner span:nth-child(4) {
            animation: grow 1s ease-in-out 0.475s infinite;
          }
          @keyframes grow {
            0%, 100% {
              transform: scaleY(1);
            }
            50% {
              transform: scaleY(1.8);
            }
          }
        </style>
        <div class="initial-spinner">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
